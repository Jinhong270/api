<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070f0c">
<title>Snake · Jinhong270</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app" id="app">
  <header class="app-header">
    <h1 class="app-title" id="appTitle" data-i18n="title">Snake</h1>
    <div class="header-actions">
      <div class="score-panel">
        <div class="score-chip">
          <span class="score-chip-label" id="scoreLabel" data-i18n="score">Score</span>
          <span class="score-chip-value" id="currentScore">0</span>
        </div>
        <div class="score-chip score-chip-best">
          <span class="score-chip-label" id="bestLabel" data-i18n="best">Best</span>
          <span class="score-chip-value" id="bestScore">0</span>
        </div>
      </div>
      <button class="icon-btn" id="fullscreenBtn" type="button" hidden data-i18n-aria="fullscreen" aria-label="Full screen">
        <svg class="icon-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        <svg class="icon-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
      </button>
    </div>
  </header>

  <div class="workspace">
    <div class="stage" id="stage">
      <div class="board-slot" id="boardSlot">
        <div class="canvas-frame" id="canvasFrame">
          <canvas id="gameCanvas"></canvas>

          <div class="overlay visible" id="overlayIdle">
            <button class="play-button" id="startBtn" type="button">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <span data-i18n="start">Start</span>
            </button>
            <p class="overlay-hint" id="idleHint">Click the board or press Space</p>
          </div>

          <div class="overlay" id="overlayPaused">
            <div class="pause-glyph" aria-hidden="true"><span></span><span></span></div>
            <p class="overlay-title" id="pausedTitle" data-i18n="paused">Paused</p>
            <p class="overlay-hint" id="pausedHint">Click the board or press Space to continue</p>
          </div>

          <div class="overlay" id="overlayGameOver">
            <p class="overlay-title" id="gameOverTitle" data-i18n="gameOver">Game over</p>
            <p class="overlay-score"><span class="overlay-score-label" id="finalScoreLabel" data-i18n="scoreWord">Score</span> <span id="finalScore">0</span></p>
            <span class="new-best-badge" id="newBestBadge" data-i18n="newRecord">New record</span>
            <button class="restart-button" id="restartFromOverBtn" type="button" data-i18n="playAgain">Play again</button>
          </div>

          <div class="toast" id="toast"></div>
        </div>
      </div>

      <div class="dpad" id="dpad">
        <button class="dpad-btn dpad-up" type="button" data-dir="up" data-i18n-aria="up" aria-label="Up">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5l7 7-1.4 1.4L13 8.8V19h-2V8.8l-4.6 4.6L5 12z"/></svg>
        </button>
        <button class="dpad-btn dpad-left" type="button" data-dir="left" data-i18n-aria="left" aria-label="Left">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5l7 7-1.4 1.4L13 8.8V19h-2V8.8l-4.6 4.6L5 12z"/></svg>
        </button>
        <button class="dpad-btn dpad-center" id="dpadCenter" type="button" aria-label="Start">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
        </button>
        <button class="dpad-btn dpad-right" type="button" data-dir="right" data-i18n-aria="right" aria-label="Right">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5l7 7-1.4 1.4L13 8.8V19h-2V8.8l-4.6 4.6L5 12z"/></svg>
        </button>
        <button class="dpad-btn dpad-down" type="button" data-dir="down" data-i18n-aria="down" aria-label="Down">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5l7 7-1.4 1.4L13 8.8V19h-2V8.8l-4.6 4.6L5 12z"/></svg>
        </button>
      </div>
    </div>

    <aside class="controls-panel">
      <section class="control-group">
        <div class="control-group-title" id="speedTitle" data-i18n="speed">Speed</div>
        <div class="mode-selector" id="modeSelector">
          <button class="mode-btn" type="button" data-speed="180" data-i18n="slow">Slow</button>
          <button class="mode-btn active" type="button" data-speed="130" data-i18n="normal">Normal</button>
          <button class="mode-btn" type="button" data-speed="90" data-i18n="fast">Fast</button>
          <button class="mode-btn" type="button" data-speed="60" data-i18n="extreme">Turbo</button>
        </div>
      </section>

      <section class="control-group">
        <div class="control-group-title" id="bgTitle" data-i18n="background">Background</div>
        <div class="color-swatches" id="colorSwatches">
          <button class="swatch active" type="button" data-color="#0b0b0b" style="background:#0b0b0b;" data-i18n-aria="colorClassic" aria-label="Classic black" aria-pressed="true"></button>
          <button class="swatch" type="button" data-color="#08131f" style="background:#08131f;" data-i18n-aria="colorDeepBlue" aria-label="Deep blue" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#071a10" style="background:#071a10;" data-i18n-aria="colorNightGreen" aria-label="Night green" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#150c1f" style="background:#150c1f;" data-i18n-aria="colorMystic" aria-label="Mystic purple" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#17191b" style="background:#17191b;" data-i18n-aria="colorGraphite" aria-label="Graphite" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#0d1b26" style="background:#0d1b26;" data-i18n-aria="colorOcean" aria-label="Ocean blue" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#200d0d" style="background:#200d0d;" data-i18n-aria="colorDarkRed" aria-label="Dark red" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#0d2016" style="background:#0d2016;" data-i18n-aria="colorJungle" aria-label="Jungle green" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#221708" style="background:#221708;" data-i18n-aria="colorBronze" aria-label="Bronze" aria-pressed="false"></button>
        </div>
      </section>

      <section class="control-group button-group">
        <button class="action-btn primary" id="restartBtn" type="button" data-i18n="start">Start</button>
        <button class="action-btn secondary" id="pauseBtn" type="button" disabled>
          <span class="btn-icon icon-pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></span>
          <span class="btn-icon icon-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
          <span class="btn-label" data-i18n="pause">Pause</span>
        </button>
        <button class="action-btn ghost" id="toggleDpadBtn" type="button" aria-pressed="false" data-i18n-aria="showDpad" aria-label="Show D-pad">
          <span class="when-off"><span class="lbl-full" data-i18n="showDpad">Show D-pad</span><span class="lbl-tiny" data-i18n="showDpadShort">D-pad</span></span>
          <span class="when-on"><span class="lbl-full" data-i18n="hideDpad">Hide D-pad</span><span class="lbl-tiny" data-i18n="hideDpadShort">Hide</span></span>
        </button>
      </section>

      <p class="hint-text" id="hint"></p>
    </aside>
  </div>
</div>
